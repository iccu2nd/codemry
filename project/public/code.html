<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Site identity / favicon -->
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="application-name" content="Codery">
<meta name="apple-mobile-web-app-title" content="Codery">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<title>Codery - View Code</title>
<link rel="preload" href="fonts/Utendo-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Utendo-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body data-floating-back>

<button class="float-back-btn" id="backBtn" type="button" aria-label="Kembali">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 8.5 12 15 18.5"/><path d="M9 12h10.5"/></svg>
</button>

<main class="app" id="app">
    <div id="skelInit" aria-hidden="true">
    <article class="skel-card skel-card-plain skel-code-detail">
      <header class="skel-sc-head">
        <div class="skeleton skel-avatar" style="width:34px;height:34px;border-radius:50%"></div>
        <div class="skel-sc-who">
          <div class="skeleton skel-line" style="width:36%;height:13px"></div>
          <div class="skeleton skel-line" style="width:24%;height:11px"></div>
        </div>
      </header>
      <div class="skel-sc-body">
        <div class="skeleton skel-line skel-title" style="width:58%;height:20px"></div>
        <div class="skeleton skel-line" style="width:84%;height:12px"></div>
      </div>
      <div class="skel-sc-tags">
        <div class="skeleton skel-pill" style="width:88px;height:36px"></div>
        <div class="skeleton skel-pill" style="width:72px;height:36px"></div>
        <div class="skeleton skel-pill" style="width:72px;height:36px"></div>
      </div>
      <div class="skel-sc-preview skel-code-preview">
        <div class="skel-sc-preview-bar">
          <div class="skeleton skel-line" style="width:30%;height:10px"></div>
          <div class="skeleton skel-line" style="width:14%;height:10px"></div>
        </div>
        <div class="skeleton skel-block" style="height:200px;border-radius:0"></div>
      </div>
      <footer class="skel-sc-foot">
        <div class="skel-sc-actions">
          <div class="skeleton skel-pill" style="width:72px;height:34px"></div>
          <div class="skeleton skel-pill" style="width:34px;height:34px"></div>
        </div>
      </footer>
    </article>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/code.js"></script>
</body>
</html>
