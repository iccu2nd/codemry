<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <style>
    .b { fill: currentColor; opacity: 0.1; }
    .s { stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
    .f { fill: currentColor; opacity: 0.8; }
    .a { stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: 0.4; }
    .d { fill: currentColor; opacity: 0.55; }
  </style>

  <ellipse cx="100" cy="180" rx="46" ry="7" class="b"/>
  <g transform="rotate(-6 100 100)">
    <rect x="56" y="54" width="88" height="102" rx="30" class="s"/>
    <rect x="56" y="54" width="88" height="102" rx="30" class="b"/>
    <path d="M56 74h88" class="a"/>
    <circle cx="72" cy="65" r="3.2" class="d"/>
    <circle cx="84" cy="65" r="3.2" class="d"/>
    <circle cx="96" cy="65" r="3.2" class="d"/>
    <!-- quizzical face -->
    <circle cx="90" cy="100" r="4.5" class="f"/>
    <circle cx="116" cy="96" r="4.5" class="f"/>
    <circle cx="102" cy="120" r="4" class="a"/>
    <!-- arms -->
    <path d="M58 118c-10 6-14 16-8 24" class="s"/>
    <path d="M142 114c10 6 14 16 8 24" class="s"/>
    <!-- legs -->
    <path d="M78 150v14M122 150v14" class="s"/>
    <path d="M70 164h16M114 164h16" class="s"/>
  </g>

  <!-- question mark, clear of the body -->
  <path d="M28 24c0-8 7-13 13-13s13 5 13 11c0 8-7 10-9 16" class="s"/>
  <circle cx="41" cy="48" r="2" class="f"/>

  <!-- signpost -->
  <path d="M172 64v68" class="s"/>
  <path d="M172 70l22-8v11l-22 8z" class="s"/>
  <path d="M172 86l-20-6v9l20 7z" class="a"/>

  <!-- trailing footsteps -->
  <circle cx="30" cy="172" r="2" class="a"/>
  <circle cx="42" cy="168" r="2" class="a"/>
  <circle cx="54" cy="172" r="2" class="a"/>
</svg>
