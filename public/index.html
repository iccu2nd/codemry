<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Codery - Feed</title>
<link rel="preload" href="fonts/Utendo-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Utendo-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    Codery
  </div>
  <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span><span></span><span></span>
  </button>
  <nav class="topnav" id="topnav">
    <div id="authArea"></div>
  </nav>
</header>

<div class="nav-backdrop" id="navBackdrop"></div>

<main class="app">
  <div class="card feed-toolbar">
    <div class="feed-toolbar-inner">
      <div>
        <div class="hero-title" style="font-size:18px;text-align:left;margin:0">Feed</div>
        <div class="hero-sub" style="text-align:left;margin:2px 0 0;font-size:12.5px">Kode terbaru & trending</div>
      </div>
      <div class="btn-row" style="margin:0;grid-template-columns:auto auto;gap:8px">
        <a class="btn btn-primary btn-sm" href="/upload">Upload</a>
        <button class="btn btn-white btn-sm" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </div>
  <div id="feedList"></div>
  <div id="feedPagination" class="feed-pagination"></div>
</main>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
