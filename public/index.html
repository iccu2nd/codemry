<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Site identity / favicon -->
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="application-name" content="Codery">
<meta name="apple-mobile-web-app-title" content="Codery">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<title>Codery - Feed</title>
<link rel="preload" href="fonts/Utendo-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Utendo-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">Codery</div>
  <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <nav class="topnav" id="topnav">
    <div id="authArea"></div>
  </nav>
</header>

<div class="nav-backdrop" id="navBackdrop"></div>

<main class="app">
  <!-- Single cohesive feed header (Gist-style: title + sort + search) -->
  <div class="feed-head">
    <div class="feed-head-top">
      <h1 class="feed-head-title">Feed</h1>
      <a class="btn btn-primary btn-sm" href="/upload">Upload</a>
    </div>
    <div class="feed-tabs" id="feedSortTabs" role="tablist">
      <button type="button" class="feed-tab active" data-sort="new" role="tab">New</button>
      <button type="button" class="feed-tab" data-sort="trending" role="tab">Trending</button>
      <button type="button" class="feed-tab" data-sort="following" role="tab">Following</button>
    </div>
    <div class="feed-search-wrap">
      <span class="feed-search-icon" id="feedSearchIcon"></span>
      <input type="search" id="feedSearch" class="feed-search-input" placeholder="Search code, tags, users…" autocomplete="off">
      <button type="button" class="feed-filter-toggle" id="feedFilterToggle" aria-expanded="false">Filter</button>
    </div>
    <div class="feed-active-chips" id="feedActiveChips" hidden></div>
    <div class="feed-filters" id="feedFilters" hidden>
      <div class="feed-lang-row" id="feedLangRow"></div>
      <div class="tag-row" id="feedTagPills"></div>
    </div>
  </div>

  <div id="recentSection" class="recent-section" style="display:none"></div>
  <div id="feedList"></div>
  <div id="feedPagination" class="feed-pagination"></div>
</main>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
