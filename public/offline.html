<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>Codery - Offline</title>
<link rel="stylesheet" href="/style.css">
<style>
  .offline-wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
    gap: 12px;
  }
  .offline-wrap h1 { font-size: 22px; margin: 0; }
  .offline-wrap p { color: var(--text-muted); margin: 0; max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="offline-wrap">
    <div style="font-size:48px">📡</div>
    <h1>Kamu offline</h1>
    <p>Tidak ada koneksi. Periksa internet lalu coba lagi.</p>
    <button class="btn btn-primary" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
