<!DOCTYPE html>

<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="application-name" content="Codery">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>404 — Page not found · Codery</title>
<link rel="preload" href="fonts/Utendo-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Utendo-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

<body data-no-bottom-nav>

<header class="topbar">
  <a class="brand" href="/" style="text-decoration:none;color:inherit">Codery</a>
</header>

<main class="app notfound-page">
  <div class="card notfound-card">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">Page not found</h1>
    <p class="notfound-sub">The page you’re looking for doesn’t exist or may have been moved.</p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="/"><i class="fa-solid fa-house" aria-hidden="true"></i>Back to feed</a>
      <a class="btn btn-white" href="/search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>Search</a>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
  // Apply theme + minimal chrome (no bottom nav on 404)
  if (typeof applyAccentTheme === 'function') applyAccentTheme()
</script>
</body>
</html>
