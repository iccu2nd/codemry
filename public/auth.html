<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Site identity / favicon -->
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="application-name" content="Codery">
<meta name="apple-mobile-web-app-title" content="Codery">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<title>Codery - Masuk / Daftar</title>
<link rel="preload" href="fonts/Utendo-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Utendo-Bold.woff" as="font" type="font/woff" crossorigin>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body data-no-bottom-nav>

<header class="topbar">
  <div class="brand">Codery</div>
</header>

<main class="app">
  <div class="card" id="authCard" style="display:none">
    <div class="hero-title" style="font-size:22px" id="authTitle">Masuk</div>
    <div class="hero-rule"></div>
    <form id="authForm">
      <div class="field"><label>Username</label><input name="username" required></div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input name="password" type="password" required id="passwordInput">
          <button type="button" class="password-eye-btn" id="togglePassword" aria-label="Tampilkan password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></button>
        </div>
      </div>
      <div class="field" id="captchaField" style="display:none">
        <label>Verifikasi: <span id="captchaQuestion"></span></label>
        <input name="captchaAnswer" id="captchaAnswerInput" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="authSubmit">Masuk</button>
    </form>
    <div class="auth-toggle" style="margin-top:14px">
      <span id="toggleAuthText">Belum punya akun?</span>
      <a href="#" class="link-btn-inline" id="toggleAuth">Daftar</a>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
