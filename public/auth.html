<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Codery - Masuk / Daftar</title>
<link rel="preload" href="fonts/Poppins-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Poppins-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body data-no-bottom-nav>

<header class="topbar">
  <div class="brand">Codery</div>
</header>

<main class="app">
  <div class="card" id="authCard" style="display:none">
    <div class="hero-title" style="font-size:22px" id="authTitle">Masuk</div>
    <div class="hero-rule"></div>
    <form id="authForm">
      <div class="field"><label>Username</label><input name="username" required></div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input name="password" type="password" required id="passwordInput">
          <button type="button" class="password-eye-btn" id="togglePassword" aria-label="Tampilkan password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="field" id="captchaField" style="display:none">
        <label>Verifikasi: <span id="captchaQuestion"></span></label>
        <input name="captchaAnswer" id="captchaAnswerInput" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="authSubmit">Masuk</button>
    </form>
    <div class="auth-toggle" style="margin-top:14px">
      <span id="toggleAuthText">Belum punya akun?</span>
      <a href="#" class="link-btn-inline" id="toggleAuth">Daftar</a>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
